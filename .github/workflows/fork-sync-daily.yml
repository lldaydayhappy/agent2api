name: Fork Sync (daily)

on:
  schedule:
    # 每 2 小时试一次，一天 12 次机会。幂等：behind=0 时几秒空转退出。
    # GitHub 的 cron 延迟/丢单是常态（实测延迟可达数小时），高频重试是唯一
    # 不依赖外部服务就能把「每天至少成功一次」压到接近确定的办法。
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report divergence, do not merge'
        type: boolean
        default: false
      via_fanout:
        description: 'internal: triggered by a peer repo, do not fan out further'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write     # 必需：self-heal 要禁用上游新带来的 workflow

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork branch from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Merge upstream into fork
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          VIA_FANOUT: ${{ inputs.via_fanout }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error

          SELF  = "fork-sync-daily.yml"
          tok   = os.environ["GH_TOKEN"]
          fb    = os.environ.get("FALLBACK_TOKEN") or ""
          repo  = os.environ["REPO"]
          br    = os.environ.get("BRANCH") or "main"
          dry   = (os.environ.get("DRY_RUN") or "").lower() in ("1", "true")
          API   = "https://api.github.com"

          def _raw(method, path, body, token):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(API + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "fork-sync-daily")
              if data:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw or b"{}")
                  except Exception:
                      return e.code, {"message": raw.decode(errors="replace")[:400]}

          def call(method, path, body=None):
              """网络/5xx/限流 重试 -> 401 换 github.token -> 回落最后结果。"""
              global tok
              last = (0, {"message": "no attempt made"})
              for attempt in range(4):
                  try:
                      st, data = _raw(method, path, body, tok)
                  except Exception as e:
                      st, data = 0, {"message": f"transport error: {e.__class__.__name__}: {e}"}
                  if st == 401 and fb and tok != fb:
                      print("primary token rejected (401) -> falling back to GITHUB_TOKEN")
                      tok = fb
                      continue
                  if st == 0 or st == 429 or 500 <= st < 600:
                      last = (st, data)
                      if attempt < 3:
                          wait = 2 ** attempt
                          print(f"transient failure (HTTP {st or 'transport'}), retry in {wait}s")
                          time.sleep(wait)
                          continue
                  return st, data
              return last

          def sync_tags(parent, repo):
              """补上游 tag 引用。GitHub fork 不复制 refs/tags/*，这里按需补。
              用 API 而非 git：tag 指向的提交都已存在于 fork，只需建引用，无需传对象。
              增量比较第一页即可——上游新增的 tag 必然出现在最新一页。"""
              st, u = call("GET", f"/repos/{parent}/tags?per_page=100")
              s2, f = call("GET", f"/repos/{repo}/tags?per_page=100")
              if st != 200 or s2 != 200 or not isinstance(u, list) or not isinstance(f, list):
                  print("tags: compare failed, skipped")
                  return
              have = {t["name"] for t in f}
              new = [t for t in u if t["name"] not in have]
              if not new:
                  print(f"tags: up to date ({len(f)} refs in fork)")
                  return
              ok = 0
              for t in new:
                  r, _ = call("POST", f"/repos/{repo}/git/refs",
                              {"ref": "refs/tags/" + t["name"], "sha": t["commit"]["sha"]})
                  if r in (200, 201):
                      ok += 1
              print(f"tags: +{ok}/{len(new)} new tag refs (fork now {len(f) + ok})")

          def snapshot(repo, br, keep=120):
              """合并前给当前状态打日期快照 —— 上游推了坏更新时可以退回来。
              每天最多一个（同名存在即跳过），只保留最近 keep 个。"""
              name = "snapshot-" + time.strftime("%Y%m%d", time.gmtime())
              st, _ = call("GET", f"/repos/{repo}/git/ref/tags/{name}")
              if st == 200:
                  print(f"snapshot: {name} already exists")
              else:
                  s2, head = call("GET", f"/repos/{repo}/git/ref/heads/{br}")
                  sha = ((head or {}).get("object") or {}).get("sha")
                  if not sha:
                      print("snapshot: cannot read head, skipped")
                  else:
                      r, _ = call("POST", f"/repos/{repo}/git/refs",
                                  {"ref": f"refs/tags/{name}", "sha": sha})
                      print(f"snapshot: {name} -> {sha[:8]} (HTTP {r})")
              # 清理过老的快照，避免无限堆积
              st3, tags = call("GET", f"/repos/{repo}/git/matching-refs/tags/snapshot-")
              if st3 == 200 and isinstance(tags, list):
                  names = sorted(t["ref"].split("/")[-1] for t in tags)
                  for old in names[:-keep]:
                      call("DELETE", f"/repos/{repo}/git/refs/tags/{old}")
                      print(f"snapshot: pruned {old}")

          def paused(repo):
              """仓库变量 FORK_SYNC_PAUSE 非空即暂停同步 —— 刹车开关。"""
              st, v = call("GET", f"/repos/{repo}/actions/variables/FORK_SYNC_PAUSE")
              if st == 200 and str(v.get("value", "")).strip().lower() not in ("", "0", "false", "no"):
                  return v.get("value")
              return None

          # 少数仓库当"枢纽"：它们的定时任务跑完，顺手拉起其余仓库。
          # 因为 GitHub 会把单个仓库的 schedule 节流甚至停摆（agent2api 已出现两次），
          # 只要还有任一枢纽活着，全网就还在同步。重复触发是幂等的，无害。
          HUBS = {"lldaydayhappy/rea", "lldaydayhappy/workbuddy-manager"}
          PEERS = ["lldaydayhappy/AIHOT", "lldaydayhappy/agent-autoloop",
                   "lldaydayhappy/agent2api", "lldaydayhappy/de-armor",
                   "lldaydayhappy/dsh-purge", "lldaydayhappy/jailbreaks",
                   "lldaydayhappy/rea", "lldaydayhappy/study-materials-fork",
                   "lldaydayhappy/workbuddy-manager", "lldaydayhappy/workbuddy2api-hub"]
          PEER_BRANCH = {"lldaydayhappy/dsh-purge": "master"}

          def fanout(repo):
              if repo not in HUBS:
                  return
              if (os.environ.get("VIA_FANOUT") or "").lower() in ("1", "true"):
                  print("fanout: skipped (this run was pulled by a peer)")
                  return
              ok = fail = 0
              for peer in PEERS:
                  if peer == repo:
                      continue
                  r, _ = call("POST", f"/repos/{peer}/actions/workflows/{SELF}/dispatches",
                              {"ref": PEER_BRANCH.get(peer, "main"), "inputs": {"via_fanout": "true"}})
                  if r in (200, 201, 204):
                      ok += 1
                  else:
                      fail += 1
                      print(f"fanout: {peer.split('/')[-1]} failed (HTTP {r})")
              print(f"fanout: pulled {ok} peer(s), {fail} failed")

          def self_heal():
              """上游新带来的 workflow 一律禁用：它们在 fork 上缺 secret/runner，
              跑起来只会失败并发邮件。禁用而非删除，避免 modify/delete 冲突。"""
              st, wfs = call("GET", f"/repos/{repo}/actions/workflows?per_page=100")
              if st != 200:
                  print(f"self-heal: cannot list workflows (HTTP {st})")
                  return
              n = 0
              for w in wfs.get("workflows", []):
                  fn = w["path"].split("/")[-1]
                  if fn == SELF or w.get("state") != "active":
                      continue
                  s2, _ = call("PUT", f"/repos/{repo}/actions/workflows/{w['id']}/disable", {})
                  print(f"self-heal: disabled {fn} (HTTP {s2})")
                  n += 1
              print(f"self-heal: {n} upstream workflow(s) disabled")

          code = 0
          ctx = {"parent": None}
          try:
              print(f"auth      : {'github.token' if tok == fb else 'repo secret'}")

              st, info = call("GET", f"/repos/{repo}")
              if st != 200:
                  print(f"::warning::cannot read repo info (HTTP {st}) — transient, next run retries")
                  sys.exit(0)
              if not info.get("fork"):
                  print("not a fork, nothing to sync")
                  sys.exit(0)

              parent = (info.get("parent") or {}).get("full_name")
              pbr    = (info.get("parent") or {}).get("default_branch")
              if not parent:
                  print("::warning::fork has no upstream parent (detached) — nothing to sync")
                  sys.exit(0)
              ctx["parent"] = parent
              owner = info["owner"]["login"]

              st, cmp = call("GET", f"/repos/{parent}/compare/{pbr}...{owner}:{br}")
              if st == 404:
                  # 上游被删/转私有/改名：不动 fork（保持原样），也不发失败通知。
                  # 上游若恢复，下一轮会自动接着同步。用户可用 `manage.py status` 查看上游可达性。
                  print(f"::warning::upstream {parent}:{pbr} unreachable (deleted/private/renamed)"
                        " — fork left untouched")
                  sys.exit(0)
              if st != 200:
                  print(f"compare unavailable ({st}), trying merge anyway")
                  behind = ahead = None
              else:
                  behind, ahead = cmp.get("behind_by", 0), cmp.get("ahead_by", 0)

              print(f"repo      : {repo}")
              print(f"branch    : {br}")
              print(f"upstream  : {parent}:{pbr}")
              if behind is not None:
                  print(f"divergence: behind {behind}, ahead {ahead}")

              hold = paused(repo)
              if hold:
                  print(f"::notice::sync paused (FORK_SYNC_PAUSE={hold}) — 本轮不合并")

              # 合并前先把残留的 active workflow 按掉：merge 会产生 push 事件，
              # 若此时还有上游 CI 处于 active，它们会被这次 push 拉起来（在 fork 上多半跑挂）。
              self_heal()

              if behind == 0:
                  print("already up to date")
                  sys.exit(0)
              if dry:
                  print("dry run: skipping merge")
                  sys.exit(0)
              if hold:
                  sys.exit(0)

              snapshot(repo, br)

              st, res = call("POST", f"/repos/{repo}/merge-upstream", {"branch": br})
              print(f"merge-upstream -> HTTP {st}")
              if st == 200:
                  print(json.dumps({"merge_type": res.get("merge_type"),
                                    "base_branch": res.get("base_branch")}))
                  sys.exit(0)

              msg = res.get("message", "")
              print(f"message: {msg}")

              if st == 409:
                  title = f"fork-sync: manual conflict on `{br}`"
                  body = (f"Daily upstream sync hit a merge conflict.\n\n"
                          f"- upstream: `{parent}:{pbr}`\n- branch: `{br}`\n"
                          f"- behind {behind}, ahead {ahead}\n\n"
                          f"```\ngit remote add upstream https://github.com/{parent}.git\n"
                          f"git fetch upstream && git merge upstream/{pbr}\n"
                          f"# fix conflicts, commit, push\n```")
                  print(f"::error::merge conflict on {br} — manual resolution required")
                  st2, issues = call("GET", f"/repos/{repo}/issues?state=open&per_page=100")
                  if st2 == 200:
                      ex = [i for i in (issues if isinstance(issues, list) else [])
                            if i.get("title") == title]
                      if ex:
                          print(f"conflict issue already open: {ex[0]['html_url']}")
                      else:
                          s3, r3 = call("POST", f"/repos/{repo}/issues",
                                        {"title": title, "body": body})
                          print(f"opened conflict issue: HTTP {s3} {r3.get('html_url','')}")
                  sys.exit(1)

              if st == 0 or st == 429 or 500 <= st < 600:
                  print(f"::warning::transient merge failure (HTTP {st or 'transport'}) — next run retries")
                  sys.exit(0)

              print(f"::error::merge-upstream failed: {st} {msg}")
              sys.exit(1)
          except SystemExit as e:
              code = e.code if isinstance(e.code, int) else 1
          finally:
              if ctx["parent"]:
                  try:
                      sync_tags(ctx["parent"], repo)
                  except Exception as e:
                      print(f"tag sync error: {e}")
              try:
                  self_heal()
              except Exception as e:
                  print(f"self-heal error: {e}")
              try:
                  fanout(repo)
              except Exception as e:
                  print(f"fanout error: {e}")

          sys.exit(code)
          PY
